[package]
name = "aio-plugin-identity-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aio-plugin-identity-model = { path = "../model" }
anyhow = "1.0.99"
argon2 = "0.5.3"
axum = "0.8.6"
dill = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["rt"] }
uuid = { version = "1.18.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
